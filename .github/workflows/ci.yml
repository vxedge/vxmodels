name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-models:
    name: SysML v2 parse/type gate
    runs-on: ubuntu-latest
    env:
      # Pinned toolchain (docs/TESTBED-SETUP.md Tier M) — bump deliberately, digests first.
      SYSIDE_URL: https://github.com/sensmetry/sysml-2ls/releases/download/0.9.1/syside-languageserver.zip
      SYSIDE_SHA256: 1c3da42826d67b2a44b897515e068ad8ee0a038ec003a06659427ed77f3af8d2
      STDLIB_URL: https://github.com/Systems-Modeling/SysML-v2-Release/archive/refs/tags/2026-04.tar.gz
      STDLIB_SHA256: 44996ee207eb41e4ceadc242c76d23505764d0698c3e3c7a22f0ed80517a7bdd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch pinned SysIDE + SysML standard library
        run: |
          mkdir -p .tools && cd .tools
          curl -sL -o syside.zip "$SYSIDE_URL"
          echo "$SYSIDE_SHA256  syside.zip" | sha256sum -c -
          unzip -o -q syside.zip
          curl -sL -o sysml-release.tar.gz "$STDLIB_URL"
          echo "$STDLIB_SHA256  sysml-release.tar.gz" | sha256sum -c -
          tar -xzf sysml-release.tar.gz --wildcards "*/sysml.library/*"
      - name: Validate models (parse + type-check, stdlib linked)
        run: |
          shopt -s globstar nullglob
          files=(models/**/*.sysml)
          [ ${#files[@]} -gt 0 ] || { echo "error: no .sysml files found"; exit 1; }
          SYSIDE_JS="$PWD/.tools/syside-languageserver.js" \
          SYSML_STDLIB="$PWD/.tools/SysML-v2-Release-2026-04/sysml.library" \
          node scripts/validate-sysml.mjs "${files[@]}"

  rust:
    name: vxmodel crate (M2 renderer)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vxmodel
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vxmodel
      - name: Build
        run: cargo build
      - name: Test
        # Exercises gate 1's output shape: renders the real vx-vehicle-01.sysml
        # and checks the emitted YAML. Gate 2 (`vxedge manifest validate --json`
        # against the render) is NOT wired into this job — it needs the vxedge
        # repo's CLI, a separate clone/build this repo's CI doesn't own (§4
        # single-source rules: this repo doesn't build vxedge's binary). Run it
        # manually per the sysml-authoring skill's double-gate command, or from
        # a workspace-level check that has both repos checked out.
        run: cargo test
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Format
        run: cargo fmt --check

  pipeline-regression:
    name: model -> manifest double-gate regression (cross-repo)
    runs-on: ubuntu-latest
    needs: rust
    # Closes the CI gap the rust job's own comment flags above: gate 2
    # (`vxedge manifest validate --json` against a real render) needs the
    # sibling vxedge repo's CLI binary, which this repo doesn't otherwise
    # build. Checks out both repos side by side and runs the exact double-gate
    # pipeline documented in sysml-authoring, for every committed renderable
    # model, asserting the same shape verified by hand when M2/M3 landed
    # (2026-07-19) — so a future change to vxedge-core's validation, vxmodel's
    # extractor, or a .sysml model itself fails CI instead of silently
    # breaking the pipeline again.
    #
    # 2026-07-31: the renderer emits §6.0 workspaces, so these assertions moved from §6.1/§6.2
    # counts (`zones`, `compute`) to workspace ones (`devices`, `slices`, `vehicles`) and now
    # pin `kind == "workspace"` — `vxedge manifest validate` still accepts the retired shapes,
    # so without that the job would pass on a renderer that regressed to them.
    steps:
      - name: Checkout vxmodels
        uses: actions/checkout@v4
        with:
          path: vxmodels
      - name: Checkout vxedge (sibling repo, read-only)
        uses: actions/checkout@v4
        with:
          repository: vxedge/vxedge
          path: vxedge
      - name: Install protoc
        # vxedge-api's build.rs (tonic-prost-build) needs the protoc binary;
        # matches vxedge/.github/workflows/ci.yml's own install step exactly.
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            vxmodels/vxmodel
            vxedge
      - name: Build vxmodel
        working-directory: vxmodels/vxmodel
        run: cargo build --release
      - name: Build vxedge-cli
        working-directory: vxedge
        run: cargo build --release -p vxedge-cli
      - name: Render + validate vx-vehicle-01 (M2 path)
        working-directory: vxmodels
        run: |
          set -euo pipefail
          VXMODEL=vxmodel/target/release/vxmodel
          VXEDGE=../vxedge/target/release/vxedge
          "$VXMODEL" render --vehicle models/vehicles/vx-vehicle-01.sysml \
            --out /tmp/vx-vehicle-01-rendered.yaml \
            --image adasProbeFl=local/vxprobe:host-process,container \
            --image adasProbeFr=local/vxprobe:host-process,container \
            --image infotainmentLoadRl=local/vxtraffic:host-process,container \
            --image adasProbeRr=local/vxprobe:host-process,container \
            --image centralCompute=local/placeholder:test,container
          "$VXEDGE" manifest validate --manifest /tmp/vx-vehicle-01-rendered.yaml --json | tee /tmp/vehicle-result.json
          # A §6.0 workspace: four zone devices plus central compute, over the two modelled
          # slices. `kind` must be `workspace` — if the renderer regressed to a §6.1/§6.2
          # document, validate would still say `valid: true` (those shapes are still checked,
          # for exactly one render away from here), so asserting the kind is what catches it.
          jq -e '.valid == true and .kind == "workspace" and .devices == 5 and .slices == 2 and .vehicles == 1' /tmp/vehicle-result.json
      # NOTE: both steps below validate the rendered *file*; neither runs the rendered
      # workspace. The renderer emits no `.vxp`, so a rendered workspace cannot currently be
      # addressed by `vxedge experiment up|validate` at all — a green run here means "the
      # renderer emits well-formed documents", not "the pipeline works end to end". Known
      # limitation, deferred to phase 3, recorded in TASKS.md.
      - name: Render + validate exp-pipeline-demo (M3 path)
        working-directory: vxmodels
        run: |
          set -euo pipefail
          VXMODEL=vxmodel/target/release/vxmodel
          VXEDGE=../vxedge/target/release/vxedge
          "$VXMODEL" render --experiment models/experiments/exp-pipeline-demo.sysml \
            --out /tmp/exp-pipeline-demo-rendered.yaml \
            --image demoNode=local/vxprobe:host-process,container
          "$VXEDGE" manifest validate --manifest /tmp/exp-pipeline-demo-rendered.yaml --json | tee /tmp/experiment-result.json
          jq -e '.valid == true and .kind == "workspace" and .devices == 1 and .slices == 1 and .experiment_id == "exp-pipeline-demo"' /tmp/experiment-result.json
